<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}StudyHelper{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <h1><a href="/dashboard">StudyHelper</a></h1>
        <nav>
            <a href="/dashboard">대시보드</a>
            <a href="/web/courses">과목</a>
            <a href="/web/documents">학습자료</a>
            <a href="/docs">API 문서</a>

            {% if current_user is defined and current_user %}
                <span class="nav-user">{{ current_user.username }}</span>
                <form method="post" action="/logout" class="nav-form">
                    <button type="submit" class="nav-button">로그아웃</button>
                </form>
            {% else %}
                <a href="/login">로그인</a>
                <a href="/register">회원가입</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
